<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geometric Pattern</title>
     <style>
       .pattern {
         display: flex;
         justify-content: center;
         align-items: center;
         height: 50vh;
         width: 50vw;
         background-color: #f0f0f0;
         position: relative;
       }
       .box {
         width: 100px;
         height: 100px;
         margin: 10px;
         
       }
       .box1{
        background-color: aqua;
        transform: rotate(45deg);
       }
       .box2{
        background-color: blue;
        position: absolute;
        top:130px;
        
    
       }
     </style>
</head>
<body>
  <div class="pattern">
        
    <div class="box box1">

    </div>
    <div class="box box2">

    </div>
  </div>
</body>
</html>
